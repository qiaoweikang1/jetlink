name: Build Unsigned IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build iOS App
        run: |
          cd ios
          xcodebuild -project Jetlink.xcodeproj -scheme Jetlink -configuration Release -destination 'generic/platform=iOS' -archivePath ../build/Jetlink.xcarchive archive CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Jetlink.xcarchive/Products/Applications/Jetlink.app Payload/
          zip -r Jetlink-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: jetlink-ipa
          path: Jetlink-unsigned.ipa
